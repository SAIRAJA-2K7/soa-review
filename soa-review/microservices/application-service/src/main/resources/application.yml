server:
  port: 8084

spring:
  application:
    name: application-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentsync}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

auth-service:
  url: ${AUTH_SERVICE_URL:http://AUTH-SERVICE}

jwt:
  secret: ${JWT_SECRET}

job-sync:
  secret: ${JOB_SYNC_SECRET}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
