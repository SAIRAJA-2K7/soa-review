server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: ${EUREKA_ENABLED:true}
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}
          predicates:
            - Path=/api/auth/**
        - id: user-profile
          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}
          predicates:
            - Path=/api/user/profile,/api/user/profile/**
        - id: user-saved-jobs
          uri: ${JOB_SERVICE_URI:lb://JOB-SERVICE}
          predicates:
            - Path=/api/user/saved-jobs,/api/user/saved-jobs/**
        - id: user-interviews
          uri: ${APPLICATION_SERVICE_URI:lb://APPLICATION-SERVICE}
          predicates:
            - Path=/api/user/interviews,/api/user/interviews/**
        - id: job-service
          uri: ${JOB_SERVICE_URI:lb://JOB-SERVICE}
          predicates:
            - Path=/api/jobs/**
        - id: application-service
          uri: ${APPLICATION_SERVICE_URI:lb://APPLICATION-SERVICE}
          predicates:
            - Path=/api/applications/**,/api/admin/**

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
