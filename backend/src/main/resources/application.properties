spring.application.name=soa-review-backend

server.port=8080

# PostgreSQL is the runtime database. Set DB_URL, DB_USERNAME, and DB_PASSWORD in the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentsync}
spring.datasource.username=${DB_USERNAME:talentsync}
spring.datasource.password=${DB_PASSWORD:Srk@1207}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

jwt.secret=${JWT_SECRET:change-me-in-production-please-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

otp.ttl-seconds=${OTP_TTL_SECONDS:300}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
