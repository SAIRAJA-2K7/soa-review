name: TalentSync quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  microservices:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talentsync_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talentsync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SOA_REVIEW_POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/talentsync_test
      SOA_REVIEW_POSTGRES_TEST_USERNAME: postgres
      SOA_REVIEW_POSTGRES_TEST_PASSWORD: postgres
      JWT_SECRET: talentsync-ci-jwt-secret-at-least-32-bytes
      JOB_SYNC_SECRET: talentsync-ci-job-sync-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run microservice tests with PostgreSQL persistence checks
        run: mvn -B -f soa-review/microservices/pom.xml test

  legacy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run legacy backend regression tests
        run: mvn -B -f backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: soa-review/package-lock.json
      - name: Install frontend dependencies
        working-directory: soa-review
        run: npm ci
      - name: Build frontend
        working-directory: soa-review
        run: npm run build
